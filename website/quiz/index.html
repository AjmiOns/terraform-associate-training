<script>
function draw() {
  document.getElementById("quizList").innerHTML = quizRows("../");
  const res = quizResultsAll(), taken = QUIZZES.filter((q) => res[q.id]);
  document.getElementById("libSub").textContent = taken.length
    ? taken.length + " of " + QUIZZES.length + " quizzes taken. Aim for 85% or higher on each."
    : "Test yourself, or study the same questions as flashcards.";
}
draw(); loadQuizMeta("../", draw);
