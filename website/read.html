<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader | Terraform 004</title>
<meta name="description" content="Read a course PDF.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="assets/js/theme.js"></script>
<link rel="stylesheet" href="assets/vendor/bootstrap/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/quiz.css">
<link rel="stylesheet" href="assets/css/library.css">
</head>
<body data-root="" data-page="courses">
<a class="skip" href="#main">Skip to content</a>
<header class="topbar" id="topbar"></header>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Site navigation"></aside>
  <main class="content wide" id="main">
    <nav aria-label="Breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="index.html">Dashboard</a></li><li class="breadcrumb-item"><a id="crumbSec" href="courses.html">Course notes</a></li><li class="breadcrumb-item active" aria-current="page"><span id="crumbTitle">Document</span></li></ol></nav>
    <div class="reader-head">
      <div><h1 id="rTitle">Document</h1><p class="sub" id="rMeta"></p></div>
      <div class="qgo" id="rActions"></div>
    </div>
    <div class="reader-frame" id="rFrame"></div>
    <nav class="pager" id="rPager" aria-label="Previous and next document"></nav>
  </main>
</div>
<script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="assets/js/quizzes.js"></script>
<script src="assets/js/library.js"></script>
<script>
/* Only files listed in the registry can be opened, so a crafted ?f= value cannot load anything else. */
(function () {
  const all = LIB.files(), want = new URLSearchParams(location.search).get("f");
  const i = all.findIndex((x) => x.file === want), cur = all[i];
  const sec = cur ? cur.kind : "courses";
  document.body.dataset.page = sec;
  const e = LIB.esc, secName = sec === "cheatsheets" ? "Cheatsheets" : "Course notes", secHref = sec + ".html";
  document.getElementById("crumbSec").textContent = secName;
  document.getElementById("crumbSec").href = secHref;
  if (!cur) {
    document.title = "Document not found | Terraform 004";
    document.getElementById("crumbTitle").textContent = "Not found";
    document.getElementById("rTitle").textContent = "Document not found";
    document.getElementById("rMeta").textContent = "This link does not match a file in the library.";
    document.getElementById("rActions").innerHTML = `<a class="btn btn-primary" href="courses.html">Course notes</a><a class="btn btn-outline-secondary" href="cheatsheets.html">Cheatsheets</a>`;
    return;
  }
  document.title = cur.title + " | Terraform 004";
  document.getElementById("crumbTitle").textContent = cur.title;
  document.getElementById("rTitle").textContent = cur.title;
  document.getElementById("rMeta").textContent = `PDF, ${cur.pages} page${cur.pages === 1 ? "" : "s"}`;
  document.getElementById("rActions").innerHTML = `<a class="btn btn-primary" href="${e(cur.file)}" target="_blank" rel="noopener">Open in new tab</a><a class="btn btn-outline-secondary" href="${e(cur.file)}" download>Download</a>`;
  document.getElementById("rFrame").innerHTML = `<iframe title="${e(cur.title)}" src="${e(cur.file)}#view=FitH"></iframe>
    <p class="fallback">If the document does not show here (some phones cannot preview PDFs), use <a href="${e(cur.file)}" target="_blank" rel="noopener">Open in new tab</a>.</p>`;
  const same = all.filter((x) => x.kind === sec), j = same.indexOf(cur);
  const prev = same[j - 1], next = same[j + 1];
  document.getElementById("rPager").innerHTML =
    (prev ? `<a class="btn btn-outline-secondary" href="${LIB.readUrl(prev.file)}">Previous: ${e(prev.title)}</a>` : "<span></span>") +
    (next ? `<a class="btn btn-outline-secondary" href="${LIB.readUrl(next.file)}">Next: ${e(next.title)}</a>` : "<span></span>");
})();
</script>
<script src="assets/js/shell.js"></script>
</body>
</html>
